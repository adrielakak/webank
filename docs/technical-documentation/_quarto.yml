project:
  type: book
  output-dir: _output

book:
  title: "Adastra : Technical Documentation"
  subtitle: "FinTechathon 2026 · Shenzhen International FinTech Competition"
  author: "Team Adastra (Adriel Kourlate, Dong Zixuan, Aadithyan Sajith Kumar, Khushi Mistry) · Faculty Advisor: Prof. Halis Sak"
  date: "October 2026"
  chapters:
    - index.qmd
    - architecture.qmd
    - algorithm.qmd
    - security.qmd

format:
  html:
    theme:
      dark: darkly
      light: flatly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    highlight-style: github-dark
    fig-responsive: true
  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    geometry:
      - top=20mm
      - bottom=20mm
      - left=20mm
      - right=20mm
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
        \usepackage{microtype}
        \usepackage[export]{adjustbox}
        \usepackage{xcolor}
        \let\oldincludegraphics\includegraphics
        \renewcommand{\includegraphics}[2][]{%
          \oldincludegraphics[#1,max width=\linewidth,max height=0.75\textheight,keepaspectratio]{#2}%
        }
        \makeatletter
        \renewcommand{\maketitle}{%
          \begin{titlepage}
            \centering
            \vspace*{2.2cm}
            
            {\fontsize{28}{34}\selectfont \bfseries \sffamily ADASTRA\par}
            \vspace{0.6cm}
            {\large \sffamily Intelligent Quantitative Risk Management \& Wealth Advisory Cockpit\par}
            
            \vspace{1.6cm}
            {\Large \bfseries Technical Documentation\par}
            \vspace{0.3cm}
            {\normalsize \textcolor{darkgray}{System Architecture $\;\cdot\;$ Core Algorithm Description $\;\cdot\;$ Security Design}\par}
            
